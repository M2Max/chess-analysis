name: docker

# Multi-platform Docker image builds for chess-analysis.
#
# Platforms:
#   linux/amd64  - x86_64 servers (incl. TrueNAS Scale)
#   linux/arm64  - ARMv8 / AArch64 (Raspberry Pi 4/5, ARM servers)
#
# Note: linux/arm/v7 (32-bit Raspberry Pi 3 / Zero) is NOT supported:
# the Bun runtime (which the server is built on) ships no 32-bit ARM
# binaries (npm platform check: cpu arm64,x64 only).
#
# Each platform is built natively on a matching runner (no QEMU
# cross-emulation: emulated Bun binaries crash under QEMU user mode):
#   linux/amd64 -> ubuntu-latest (x64), linux/arm64 -> ubuntu-24.04-arm.
# The final multi-arch manifest is assembled only after both platform
# images are pushed, so a failed build never publishes a partial image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/m2max/chess-analysis

jobs:
  # Shared step list for the two platform builds.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runs-on: ubuntu-latest, suffix: amd64 }
          - { platform: linux/arm64, runs-on: ubuntu-24.04-arm, suffix: arm64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version tag
        id: ver
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest-${{ matrix.suffix }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.suffix }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.architecture=${{ matrix.suffix }}

  # Assemble the multi-arch manifest from the per-platform images.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version tag
        id: ver
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (latest + sha + version)
        run: |
          sha="${GITHUB_SHA}"
          ver="${{ steps.ver.outputs.version }}"
          for tag in latest "sha-${sha}" "${ver}"; do
            docker buildx imagetools create \
              -t "${IMAGE}:${tag}" \
              "${IMAGE}:${tag}-amd64" \
              "${IMAGE}:${tag}-arm64" \
              && echo "manifest ${tag} OK"
          done

      - name: Smoke check (inspect multi-arch manifest)
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest" | sed -n '1,8p'
