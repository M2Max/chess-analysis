name: docker

# Multi-platform Docker image builds for chess-analysis.
#
# Platforms:
#   linux/amd64   - x86_64 servers (incl. TrueNAS Scale)
#   linux/arm64   - ARMv8 / AArch64 (Raspberry Pi 4/5, ARM servers)
#   linux/arm/v7  - 32-bit ARM (Raspberry Pi 3, Zero 2 W)
#
# Publishing:
#   push to main  -> tags: latest, sha-<commit>, dev
#   push tag v*   -> adds: <tag>
#   manual        -> workflow_dispatch (builds dev)
#
# The image is pushed to GitHub Container Registry (ghcr.io) only after a
# fully successful multi-platform build (buildx push), so a failed build
# never publishes a broken or partial image. The GHA build cache makes
# rebuilds idempotent and fast.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-architecture emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # GHCR image names are lowercase; the owner comes from the repo.
      - name: Compute image names
        id: img
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/chess-analysis:latest
            ghcr.io/${{ steps.img.outputs.owner }}/chess-analysis:sha-${{ github.sha }}
            ghcr.io/${{ steps.img.outputs.owner }}/chess-analysis:${{ steps.img.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke check (pull amd64 manifest)
        run: |
          docker manifest inspect \
            "ghcr.io/${{ steps.img.outputs.owner }}/chess-analysis:latest" > /dev/null \
            && echo "manifest OK"
